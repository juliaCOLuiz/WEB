        switch(dia){

            case 4: console.log("Quarta");

             case 6: console.log("Sexta");

             case 7: console.log("Sábado");

                console.error("Dia inválido");
        }

          }

        let soma= (a,b)=>{return a+b}
        console.log(`Soma: ${soma(10,20)}`)
